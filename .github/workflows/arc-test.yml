name: ARC Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        job: [1, 2, 3]

    runs-on: arc-runner-set

    steps:
      - name: Show runner
        run: |
          echo "Job: ${{ matrix.job }}"
          echo "Runner: $RUNNER_NAME"
          echo "Hostname: $(hostname)"

      - name: Wait
        run: sleep 60

      - name: Finished
        run: echo "Job ${{ matrix.job }} completed"
