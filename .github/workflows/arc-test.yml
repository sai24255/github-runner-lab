name: ARC Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: arc-runner-set

    steps:
      - name: Show runner information
        run: |
          echo "================================="
          echo "Running on ARC self-hosted runner"
          echo "================================="
          echo "Hostname:"
          hostname

          echo "OS:"
          uname -a

          echo "Runner:"
          echo "$RUNNER_NAME"

      - name: Keep runner busy
        run: |
          echo "Sleeping for 60 seconds..."
          sleep 60

      - name: Finished
        run: echo "ARC runner job completed successfully!"
